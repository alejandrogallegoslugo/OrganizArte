<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Main Icon Neon Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" filter="url(#subtle-shadow)" />
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon-grad)" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 8" />

  <!-- Logo Mark: Drama Mask + Treble Clef Combination (Neon Glowing Vector) -->
  <g filter="url(#neon-glow)">
    <!-- Mask Upper Arch & Crown -->
    <path d="M 160 170 C 210 130, 302 130, 352 170 C 340 250, 310 290, 256 310 C 202 290, 172 250, 160 170 Z" 
          fill="none" stroke="url(#neon-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Mask Eyes (Happy / Expressive curves) -->
    <path d="M 195 190 C 210 180, 225 180, 235 190" fill="none" stroke="url(#neon-grad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 277 190 C 287 180, 302 180, 317 190" fill="none" stroke="url(#neon-grad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Mask Smile -->
    <path d="M 210 235 C 235 260, 277 260, 302 235" fill="none" stroke="url(#neon-grad)" stroke-width="14" stroke-linecap="round" />

    <!-- Intertwined Treble Clef & Musical Rhythm Wave -->
    <path d="M 256 375 C 256 410, 220 425, 195 405 C 175 385, 185 350, 220 345 C 275 335, 340 270, 280 120 C 260 70, 235 100, 256 160 L 256 425 C 256 450, 230 460, 215 445" 
          fill="none" stroke="url(#neon-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
          
    <circle cx="215" cy="445" r="10" fill="url(#neon-grad)" />
  </g>
</svg>
